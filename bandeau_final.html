<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Bandeau défilant (5cm - Final)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root { 
      --panel-bg: rgba(0,0,0,0.75); 
      --accent: #00BFFF;
      --hex-color: #0d2836; 
      --scroll-text-color: white;
      --status-red: #FF4500;
      --status-yellow: #FFFF00;
      --status-blue: #00BFFF;
      --status-white: #FFFFFF;
    }

    #editor {
        min-height: 100px;
        border: 1px solid #444;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 4px;
        white-space: pre-wrap;
        overflow-y: auto;
        color: white;
        background-color: #111;
        font-family: Arial, sans-serif;
        font-size: 1em;
    }

    body { 
        background: black;
        color: white; 
        font-size: 2rem; 
        margin: 0; 
        font-family: Arial, sans-serif; 
        margin-bottom: 5cm; 
    }

    .container { 
        position: fixed; 
        bottom: 0; 
        left: 0;
        width: 100vw; 
        height: 5cm; 
        display: flex; 
        align-items: center; 
        overflow: hidden; 
        background: rgba(0,0,0,0.8); 
        border-top: 3px solid var(--accent); 
        z-index: 100; 
    }

    .scroll { 
        animation: horizontalScroll 15s linear infinite; 
        white-space: nowrap; 
        display: flex;
        color: var(--scroll-text-color); 
        width: max-content; 
    }

    @keyframes horizontalScroll { 
        0% { transform: translateX(0%); } 
        100% { transform: translateX(-50%); } 
    }

    .editor-panel {
        position: fixed;
        top: 20px;
        left: 20px;
        background: var(--panel-bg);
        padding: 14px;
        border-radius: 12px;
        width: 320px;
        font-size: 1rem;
        color: #fff;
        z-index: 999;
    }

    .action-btn { 
        position: fixed; 
        right: 20px; 
        padding: 10px 14px; 
        border-radius: 8px; 
        border: none; 
        cursor: pointer; 
        background: var(--accent); 
        color: #000; 
        font-weight: 600; 
        z-index: 101; 
    }

    .editor-hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <div id="scroll" class="scroll">
        <div id="scrollContent"></div>
    </div>
  </div>

  <button id="togglePanel" class="action-btn" style="top:20px;">Cacher l’éditeur</button>
  <button id="fullscreenBtn" class="action-btn" style="top:70px;">Mode Affichage Bando</button>
  <button id="saveToGitBtn" class="action-btn" style="top:120px;">Sauvegarder sur GitHub</button>

  <div class="editor-panel editor-hidden">
    <h3>Modifier le texte</h3>
    <div id="editor" contenteditable="true"></div>

    <label>Couleur :</label>
    <input id="color" type="color" value="#FFFFFF">

    <label>Vitesse : <span id="speedValue">5</span></label>
    <input id="speed" type="range" min="3" max="60" value="5">

    <button id="updateBtn">Mettre à jour</button>
  </div>

  <script>
    const STORAGE_KEY_TEXT = 'bandeau_html_content'; 

    function prepareScrollContent(htmlContent){
        let clean = htmlContent.replace(/<br>/g, ' ')
                               .replace(/<div>/g, ' ')
                               .replace(/<\/div>/g, '')
                               .replace(/\s+/g, ' ');
        return clean + clean;
    }

    function updateScrollFromHtml(htmlContent){
        document.getElementById('scrollContent').innerHTML =
            prepareScrollContent(htmlContent);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const editor = document.getElementById('editor');

        const saved = localStorage.getItem(STORAGE_KEY_TEXT) || "Bienvenue dans le bandeau défilant";
        editor.innerHTML = saved;
        updateScrollFromHtml(saved);

        document.getElementById('updateBtn').onclick = () => {
            const html = editor.innerHTML;
            updateScrollFromHtml(html);
            localStorage.setItem(STORAGE_KEY_TEXT, html);
        };
    });

    /* -------------------------------------------------------------------------
        🌟 SAUVEGARDE GITHUB — VIA BACKEND RENDER
    ------------------------------------------------------------------------- */

    document.getElementById('saveToGitBtn').addEventListener('click', async () => {
      const secret = prompt("Entrez le code API secret :");
      if (!secret) return;

      const htmlContent = document.getElementById('editor').innerHTML;

      const payload = {
        path: "bandeau/sauvegarde.html",
        content: htmlContent,
        message: "Mise à jour du bandeau via éditeur web"
      };

      try {
        const res = await fetch("https://github-save-backend.onrender.com/save", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-secret": secret
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          alert("Erreur : " + JSON.stringify(data));
          return;
        }

        alert("Sauvegarde réussie !\n" + data.url);

      } catch (err) {
        alert("Erreur réseau : " + err.message);
      }
    });

  </script>
</body>
</html>
