<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Bandeau défilant (5cm - Final)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root { 
      --panel-bg: rgba(0,0,0,0.75); 
      --accent: #00BFFF;
      --hex-color: #0d2836; 
      --scroll-text-color: white; 
      --status-red: #FF4500;
      --status-yellow: #FFFF00;
      --status-blue: #00BFFF;
      --status-white: #FFFFFF;
    }

    #editor {
        min-height: 100px;
        border: 1px solid #444;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 4px;
        white-space: pre-wrap;
        overflow-y: auto;
        color: white;
        background-color: #111;
        font-family: Arial, sans-serif;
        font-size: 1em;
    }

    body { 
        background: black;
        color: white; 
        font-size: 2rem; 
        margin: 0; 
        font-family: Arial, sans-serif; 
        margin-bottom: 5cm; 
    }

    .container { 
        position: fixed; 
        bottom: 0; 
        left: 0;
        width: 100vw; 
        height: 5cm; 
        display: flex; 
        align-items: center; 
        overflow: hidden; 
        background: rgba(0,0,0,0.8); 
        border-top: 3px solid var(--accent); 
        z-index: 100; 
    }

    #scroll { 
        animation: horizontalScroll 15s linear infinite; 
        white-space: nowrap; 
        display: flex;
        color: var(--scroll-text-color); 
        width: max-content; 
    }

    @keyframes horizontalScroll { 
        0% { transform: translateX(0%); } 
        100% { transform: translateX(-50%); } 
    }

    .editor-panel {
        position: fixed;
        top: 20px;
        left: 20px;
        background: var(--panel-bg);
        padding: 14px;
        border-radius: 12px;
        width: 320px;
        font-size: 1rem;
        color: #fff;
        z-index: 999;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    
    .editor-panel label {
        font-weight: bold;
    }

    .action-btn { 
        position: fixed; 
        right: 20px; 
        padding: 10px 14px; 
        border-radius: 8px; 
        border: none; 
        cursor: pointer; 
        background: var(--accent); 
        color: #000; 
        font-weight: 600; 
        z-index: 101; 
        width: 220px; 
        text-align: center;
    }

    .editor-hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <div id="scroll" class="scroll">
        <div id="scrollContent"></div>
    </div>
  </div>

  <button id="togglePanel" class="action-btn" style="top:20px;">Cacher l’éditeur</button>
  <button id="fullscreenBtn" class="action-btn" style="top:70px;">Mode Affichage Bando</button>
  <button id="saveToGitBtn" class="action-btn" style="top:120px;">Sauvegarder sur GitHub</button>
  <button id="loadFromGitBtn" class="action-btn" style="top:170px;">Charger depuis GitHub</button>   <div class="editor-panel"> 
    <h3>Modifier le texte</h3>
    <div id="editor" contenteditable="true"></div>

    <label for="color">Couleur du texte :</label>
    <input id="color" type="color" value="#FFFFFF">

    <label>Vitesse (en s) : <span id="speedValue">15</span></label>
    <input id="speed" type="range" min="3" max="60" value="15">

    <button id="updateBtn">Mettre à jour le bandeau</button>
  </div>

  <script>
    const STORAGE_KEY_TEXT = 'bandeau_html_content'; 
    const STORAGE_KEY_COLOR = 'bandeau_color';
    const STORAGE_KEY_SPEED = 'bandeau_speed';

    function prepareScrollContent(htmlContent){
        // Nettoie le contenu et le double pour le défilement continu
        let clean = htmlContent.replace(/<br>/g, ' ')
                               .replace(/<div>/g, ' ')
                               .replace(/<\/div>/g, '')
                               .replace(/\s+/g, ' ')
                                .trim(); 
        // Ajoute de l'espace entre les deux répétitions
        return clean + " &nbsp; &nbsp; &nbsp; " + clean;
    }

    function updateScrollFromHtml(htmlContent){
        const scrollContent = document.getElementById('scrollContent');
        if (scrollContent) {
            scrollContent.innerHTML = prepareScrollContent(htmlContent);
        }
    }

    function applySettings(color, speed) {
        const scrollElement = document.getElementById('scroll');
        if (scrollElement) {
            document.documentElement.style.setProperty('--scroll-text-color', color);
            scrollElement.style.animationDuration = speed + 's';
        }
        
        const speedValueElement = document.getElementById('speedValue');
        if (speedValueElement) {
            speedValueElement.textContent = speed;
        }

        localStorage.setItem(STORAGE_KEY_COLOR, color);
        localStorage.setItem(STORAGE_KEY_SPEED, speed);
    }


    document.addEventListener('DOMContentLoaded', () => {
        const editor = document.getElementById('editor');
        const updateBtn = document.getElementById('updateBtn');
        const colorInput = document.getElementById('color');
        const speedInput = document.getElementById('speed');
        const togglePanelBtn = document.getElementById('togglePanel');
        const editorPanel = document.querySelector('.editor-panel');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const saveToGitBtn = document.getElementById('saveToGitBtn');
        const loadFromGitBtn = document.getElementById('loadFromGitBtn'); // Récupération du nouveau bouton

        // 1. Chargement des données au démarrage
        const savedText = localStorage.getItem(STORAGE_KEY_TEXT) || "Bienvenue dans le bandeau défilant ! Modifiez ce texte dans le panneau de gauche.";
        const savedColor = localStorage.getItem(STORAGE_KEY_COLOR) || "#FFFFFF";
        const savedSpeed = localStorage.getItem(STORAGE_KEY_SPEED) || "15";
        
        if (editor) editor.innerHTML = savedText;
        if (colorInput) colorInput.value = savedColor;
        if (speedInput) speedInput.value = savedSpeed;
        
        // Appliquer l'état initial
        updateScrollFromHtml(savedText);
        applySettings(savedColor, savedSpeed);

        // 2. Événement Mettre à jour
        if (updateBtn && editor) {
            updateBtn.onclick = () => {
                const html = editor.innerHTML;
                updateScrollFromHtml(html);
                localStorage.setItem(STORAGE_KEY_TEXT, html);
                alert("Bandeau mis à jour localement !");
            };
        }
        
        // 3. Événements Couleur et Vitesse
        if (colorInput && speedInput) {
            colorInput.oninput = (e) => {
                applySettings(e.target.value, speedInput.value);
            };

            speedInput.oninput = (e) => {
                applySettings(colorInput.value, e.target.value);
            };
        }

        // 4. Événement Bascule (Cacher/Afficher l'éditeur)
        if (togglePanelBtn && editorPanel) {
            if (editorPanel.classList.contains('editor-hidden')) {
                togglePanelBtn.textContent = 'Afficher l’éditeur';
            } else {
                togglePanelBtn.textContent = 'Cacher l’éditeur';
            }

            togglePanelBtn.onclick = () => {
                const isHidden = editorPanel.classList.toggle('editor-hidden');
                togglePanelBtn.textContent = isHidden ? 'Afficher l’éditeur' : 'Cacher l’éditeur';
            };
        }

        // 5. Événement Mode Affichage Bando
        if (fullscreenBtn && editorPanel) {
            fullscreenBtn.onclick = () => {
                editorPanel.classList.add('editor-hidden');
                document.querySelectorAll('.action-btn').forEach(btn => {
                    btn.classList.add('editor-hidden');
                });
                
                if (togglePanelBtn) togglePanelBtn.textContent = 'Afficher l’éditeur';

                alert("Mode Affichage Bando activé. Actualisez la page pour réafficher les contrôles.");
            };
        }
        
        /* -------------------------------------------------------------------------
            🌟 SAUVEGARDE GITHUB
        ------------------------------------------------------------------------- */
        if (saveToGitBtn && editor) {
            saveToGitBtn.addEventListener('click', async () => {
                const secret = prompt("Entrez le code API secret :");
                if (!secret) return;

                const htmlContent = editor.innerHTML;

                const payload = {
                    path: "bandeau/sauvegarde.html",
                    content: htmlContent,
                    message: "Mise à jour du bandeau via éditeur web"
                };

                try {
                    const res = await fetch("https://github-save-backend.onrender.com/save", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "x-api-secret": secret
                        },
                        body: JSON.stringify(payload)
                    });

                    const data = await res.json();

                    if (!res.ok) {
                        alert("Erreur : " + JSON.stringify(data));
                        return;
                    }

                    alert("Sauvegarde réussie !\n" + data.url);

                } catch (err) {
                    alert("Erreur réseau : " + err.message);
                }
            });
        }

        /* -------------------------------------------------------------------------
            🌟 CHARGEMENT DEPUIS GITHUB (NOUVELLE FONCTIONNALITÉ)
        ------------------------------------------------------------------------- */
        if (loadFromGitBtn && editor) {
            loadFromGitBtn.addEventListener('click', async () => {
                const rawUrl = prompt("Entrez l'URL brute (raw) de GitHub pour charger le bandeau (ex: https://raw.githubusercontent.com/.../sauvegarde.html) :");
                if (!rawUrl) return;

                try {
                    const res = await fetch(rawUrl);

                    if (!res.ok) {
                        alert(`Erreur de chargement: Le fichier n'a pas été trouvé ou une erreur est survenue (Statut: ${res.status}).`);
                        return;
                    }

                    const content = await res.text();
                    
                    // 1. Mettre à jour l'éditeur
                    editor.innerHTML = content;
                    // 2. Mettre à jour le bandeau défilant et sauvegarder localement
                    updateScrollFromHtml(content);
                    localStorage.setItem(STORAGE_KEY_TEXT, content);

                    alert("Chargement réussi ! Le bandeau a été mis à jour.");

                } catch (err) {
                    alert("Erreur réseau ou CORS lors du chargement : " + err.message);
                }
            });
        }
    });

  </script>
</body>
</html>
