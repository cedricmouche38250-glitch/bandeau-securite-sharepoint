<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Bandeau défilant (5cm - Final)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    /* ------------------ TON CSS ORIGINAL (inchangé) ------------------ */
    /* (Je ne supprime rien, tout reste identique à ton fichier d'origine) */

    :root { 
      --panel-bg: rgba(0,0,0,0.75); 
      --accent: #00BFFF;
      --gyrophare-glow: rgba(0, 191, 255, 1);
      --hex-color: #0d2836; 
      --scroll-text-color: white;
      --status-red: #FF4500;
      --status-yellow: #FFFF00;
      --status-blue: #00BFFF;
      --status-white: #FFFFFF;
    }

    .status-red { color: var(--status-red); font-weight: bold; }
    .status-yellow { color: var(--status-yellow); font-weight: bold; }
    .status-blue { color: var(--status-blue); font-weight: bold; }
    .status-white { color: var(--status-white); }

    #editor {
        min-height: 100px;
        border: 1px solid #444;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 4px;
        white-space: pre-wrap;
        overflow-y: auto;
        color: white;
        background-color: #111;
        font-family: Arial, sans-serif;
        font-size: 1em;
    }

    body { 
        background:
            linear-gradient(217deg, rgba(0,0,0,0.8), rgba(0,0,0,0.1) 70.7%),
            linear-gradient(127deg, rgba(0,0,0,0.8), rgba(0,0,0,0.1) 70.7%),
            linear-gradient(336deg, rgba(0,0,0,0.8), rgba(0,0,0,0.1) 70.7%),
            #000;
        color: white; 
        font-size: 2rem; 
        margin: 0; 
        font-family: Arial, sans-serif; 
        position: relative;
        background-image: 
            linear-gradient(to right, var(--hex-color) 1px, transparent 1px),
            linear-gradient(to bottom, var(--hex-color) 1px, transparent 1px);
        background-size: 50px 50px; 
        box-shadow: inset 0 0 100px rgba(0, 191, 255, 0.1);
        margin-bottom: 5cm; 
    }

    .container { 
        position: fixed; 
        bottom: 0; 
        left: 0;
        width: 100vw; 
        height: 5cm; 
        display: flex; 
        align-items: center; 
        justify-content: flex-start; 
        overflow: hidden; 
        background: rgba(0,0,0,0.8); 
        border-top: 3px solid var(--accent); 
        z-index: 100; 
        position: relative; 
    }

    .scroll { 
        animation: horizontalScroll 15s linear infinite; 
        white-space: nowrap; 
        display: flex;
        color: var(--scroll-text-color); 
        transform: translateX(0%); 
        width: max-content; 
    }

    @keyframes horizontalScroll { 
        0% { transform: translateX(0%); } 
        100% { transform: translateX(-50%); } 
    }

    .editor-panel {
        position: fixed;
        top: 20px;
        left: 20px;
        background: var(--panel-bg);
        padding: 14px;
        border-radius: 12px;
        width: 320px;
        font-size: 1rem;
        box-shadow: 0 6px 18px rgba(0,0,0,0.6);
        color: #fff;
        z-index: 999;
    }

    .action-btn { 
        position: fixed; 
        right: 20px; 
        padding: 10px 14px; 
        border-radius: 8px; 
        border: none; 
        cursor: pointer; 
        background: var(--accent); 
        color: #000; 
        font-weight: 600; 
        z-index: 101; 
    }

    .color-apply-btn {
        flex-grow: 1;
        padding: 8px;
        font-size: 0.9em;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        white-space: nowrap; 
    }

    .editor-hidden { display: none !important; }

  </style>
</head>
<body>

  <!-- Bandeau défilant -->
  <div class="container">
    <div id="scroll" class="scroll">
        <div id="scrollContent" class="scroll-content"></div>
    </div>
  </div>

  <!-- Boutons -->
  <button id="togglePanel" class="action-btn" style="top:20px;">Cacher l’éditeur</button>
  <button id="fullscreenBtn" class="action-btn" style="top:70px;">Mode Affichage Bando</button>

  <!-- 🌟 NOUVEAU : Bouton Sauvegarde GitHub -->
  <button id="saveToGitBtn" class="action-btn" style="top:120px;">Sauvegarder sur GitHub</button>

  <!-- Panneau Éditeur -->
  <div class="editor-panel editor-hidden">
    <h3>Modifier le texte</h3>
    <div id="editor" contenteditable="true"></div>
    <label>Couleur :</label>
    <input id="color" type="color" value="#FFFFFF">

    <h4>Couleur sur sélection :</h4>
    <button id="redBtn" class="color-apply-btn" style="background:#FF4500">Rouge</button>
    <button id="yellowBtn" class="color-apply-btn" style="background:#FFFF00;color:black">Jaune</button>
    <button id="blueBtn" class="color-apply-btn" style="background:#00BFFF">Bleu</button>
    <button id="whiteBtn" class="color-apply-btn" style="background:#888">Blanc</button>

    <label>Vitesse : <span id="speedValue">5</span></label>
    <input id="speed" type="range" min="3" max="60" value="5">

    <button id="updateBtn">Mettre à jour</button>
  </div>

  <script>
    /* TON SCRIPT ORIGINAL (inchangé) */
    /* + le code GitHub ajouté à la fin */

    const STORAGE_KEY_TEXT = 'bandeau_html_content'; 
    const STORAGE_KEY_SPEED = 'bandeau_speed';
    const STORAGE_KEY_COLOR = 'bandeau_color'; 

    function prepareScrollContent(htmlContent){
        let cleanContent = htmlContent.replace(/<br>/g, ' ');
        cleanContent = cleanContent.replace(/<div>/g, ' ').replace(/<\/div>/g, '');
        cleanContent = cleanContent.replace(/\s+/g, ' ');
        return cleanContent + cleanContent;
    }

    function updateScrollFromHtml(htmlContent){
        document.getElementById('scrollContent').innerHTML =
            prepareScrollContent(htmlContent);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const editor = document.getElementById('editor');

        const savedHtml = localStorage.getItem(STORAGE_KEY_TEXT) || "Bienvenue dans le bandeau";
        editor.innerHTML = savedHtml;
        updateScrollFromHtml(savedHtml);

        document.getElementById('updateBtn').onclick = () => {
            const html = editor.innerHTML;
            updateScrollFromHtml(html);
            localStorage.setItem(STORAGE_KEY_TEXT, html);
        };
    });

    /* -------------------------------------------------------------------------
        🌟 CODE POUR SAUVEGARDE SUR GITHUB
    ------------------------------------------------------------------------- */

    document.getElementById('saveToGitBtn').addEventListener('click', async () => {
      const secret = prompt("Entrez le code API secret :");
      if (!secret) return alert("Annulé.");

      const htmlContent = document.getElementById('editor').innerHTML;

      const payload = {
        path: "bandeau/sauvegarde.html",   // ← CHEMIN DANS TON GITHUB
        content: htmlContent,
        message: "Mise à jour du bandeau via l'éditeur web"
      };

      try {
        const res = await fetch("http://localhost:3000/save", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-secret": secret
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          alert("Erreur : " + JSON.stringify(data));
          return;
        }

        alert("Sauvegarde réussie !\nFichier mis à jour :\n" + data.url);

      } catch (err) {
        alert("Erreur réseau : " + err.message);
      }
    });

  </script>
</body>
</html>
